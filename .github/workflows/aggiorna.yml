name: Aggiorna dati ANAC

on:
  schedule:
    # ANAC pubblica nei giorni feriali: due passaggi al giorno, orari UTC
    - cron: "30 8 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      giorni:
        description: "Giorni indietro da raccogliere (14 per il primo popolamento)"
        default: "3"

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install requests

      - name: Raccolta dati ANAC
        run: python aggiorna.py --giorni "${{ github.event.inputs.giorni || '3' }}"

      - name: Genera le pagine per comune
        run: python genera_sito.py

      - name: Commit dei dati e delle pagine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "dati: aggiornamento $(date -u +%Y-%m-%d)"
            # GitHub puo' rispondere con errori temporanei (500): fino a 5 tentativi
            for tentativo in 1 2 3 4 5; do
              if git pull --rebase && git push; then
                exit 0
              fi
              echo "Invio non riuscito (tentativo $tentativo di 5): riprovo tra $((tentativo * 30)) secondi"
              sleep $((tentativo * 30))
            done
            exit 1
          fi
